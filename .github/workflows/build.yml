
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose App Module
        run: |
          echo "===== PROJECTS ====="
          gradle projects
          echo "===== APP TASKS ====="
          gradle :app:tasks --all
          echo "===== APP BUILD FILE ====="
          cat app/build.gradle
          echo "===== ROOT BUILD FILE ====="
          cat build.gradle
          echo "===== SETTINGS FILE ====="
          cat settings.gradle

